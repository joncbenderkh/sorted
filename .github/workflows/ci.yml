name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  GODOT_VERSION: 4.7.2

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "gdtoolkit==4.*"
      - run: gdlint scripts tests
      - run: gdformat --check scripts tests

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ env.GODOT_VERSION }}
          use-dotnet: false
      - name: Import project and check scripts parse
        run: godot --headless --import
      - name: Run main scene headless
        run: godot --headless --quit-after 5
      - name: Run GUT tests
        run: godot --headless -s addons/gut/gut_cmdln.gd -gconfig=res://.gutconfig.json
      - name: Run gdUnit4 tests
        run: >
          godot --headless -s -d --remote-debug tcp://127.0.0.1:0
          res://addons/gdUnit4/bin/GdUnitCmdTool.gd
          -a res://tests/gdunit --ignoreHeadlessMode
